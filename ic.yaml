---
# 1. Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret

#default secret for database credentials
type: Opaque
stringData:
  mariadb-root-password: "example"
  mariadb-database: "icdb"

---
# 2. JavaFX App Deployment
apiVersion: apps/v1
kind: Deployment
# otp2_inclass_assignment_leo is a Unique identifier for the deployment, used for managing the deployment lifecycle
metadata:
  name: otp2_inclass_assignment_leo
spec:
# Only one replica of the application will be running at any given time,
#ensuring that the application is always available and can handle requests.
  replicas: 1
  selector:
 # The selector defines how the deployment finds which pods to manage. It matches pods with the label "app: otp2_inclass_assignment_leo".
    matchLabels:
      app: otp2_inclass_assignment_leo
  template:
    metadata:
      labels:
        app: otp2_inclass_assignment_leo
    spec:
      containers:
        - name: javafx-app
          image: leoleerila/otp2:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: "host.minikube.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "time_calculator"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: mariadb-root-password
            - name: DISPLAY
              value: "host.minikube.internal:0.0"
  # Instructions to run the container inside Minikube:
  # 1. Start Minikube with the following command:
  #    minikube start --driver=docker
  # 2. Use minikube's Docker daemon to build the Docker image:
  #    minikube image build -t leoleerila/otp2:v2 .
# 3. Apply the Kubernetes manifests:
#    kubectl apply -f ic.yaml
#4.# 1. Direct your local Docker CLI to Minikube's daemon
#& minikube -p minikube docker-env --shell powershell | Invoke-Expression
